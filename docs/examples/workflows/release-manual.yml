# Example Manual Release Workflow
#
# This workflow removes automation for version PR creation but keeps
# automated publishing when version PRs are merged.
#
# Process:
# 1. Developer runs: pnpm changeset:version
# 2. Developer creates PR manually with version changes
# 3. PR is reviewed and merged
# 4. This workflow automatically publishes to npm
#
# Pros:
# - No special tokens required
# - Works with default GITHUB_TOKEN
# - Manual review ensures intentional releases
#
# Cons:
# - Requires manual PR creation
# - Slower release cycle
#
# See: docs/RELEASE-PROCESS.md for detailed instructions

name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    # Only publish if version PR has been merged
    # Check for version commit message or [release] tag
    if: |
      github.event.head_commit.message == 'chore: Version packages' ||
      contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish provenance
        run: |
          echo "Packages published with provenance"

# Manual steps to create version PR:
#
# 1. Create changeset for your changes:
#    pnpm changeset
#
# 2. When ready to release, create version PR:
#    git checkout -b release/version-packages
#    pnpm changeset:version
#    git add .
#    git commit -m "chore: Version packages"
#    git push origin release/version-packages
#
# 3. Create PR on GitHub, get approval, merge
#
# 4. Automated workflow publishes to npm
