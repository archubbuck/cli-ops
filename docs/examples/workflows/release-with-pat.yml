# Example Release Workflow Using Personal Access Token (PAT)
#
# This workflow demonstrates the recommended approach for handling
# GitHub Actions PR creation restrictions.
#
# Setup Requirements:
# 1. Create a fine-grained Personal Access Token with:
#    - Repository access: archubbuck/cli-ops
#    - Permissions: contents (read+write), pull_requests (read+write)
# 2. Add token as repository secret: RELEASE_TOKEN
# 3. Replace this file with .github/workflows/release.yml
#
# See: docs/RELEASE-PROCESS.md for detailed instructions

name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use PAT for PR creation
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: 'chore: Version packages'
          title: 'chore: Version packages'
        env:
          # Use PAT for PR creation
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Packages published with provenance:"
          echo "${{ steps.changesets.outputs.publishedPackages }}"
