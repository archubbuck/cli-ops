name: Plugin Verification
on:
  pull_request:
    paths:
      - 'plugins/clio-plugin-**/**'
  workflow_dispatch:
    inputs:
      plugin_name:
        description: 'Plugin name to verify (e.g., @cli-ops/clio-plugin-tasks)'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - name: Build plugin
        run: pnpm build

      - name: Run plugin verification
        run: node scripts/verify-plugin.js ${{ github.event.inputs.plugin_name || 'all' }}

      - name: Security audit
        run: pnpm audit --audit-level=moderate

      - name: TruffleSecurity scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          fail-verified: true
