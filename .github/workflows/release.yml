name: Release
# This workflow supports two npm authentication methods:
# 1. Trusted Publishing (OIDC) - Recommended: Token-less, secure, automatic provenance
#    - Requires: Trusted publishers configured on npmjs.com for each package
#    - Requires: id-token: write permission (already configured below)
#    - See: docs/NPM-TRUSTED-PUBLISHING.md
# 2. Token-Based - Traditional: Uses NPM_TOKEN secret
#    - Requires: NPM_TOKEN secret in repository settings
#    - See: docs/RELEASE-PROCESS.md
#
# The workflow automatically uses the appropriate method:
# - If NPM_TOKEN is set → uses token-based authentication
# - If NPM_TOKEN is absent → uses OIDC trusted publishing

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Validate RELEASE_TOKEN
        if: ${{ !env.RELEASE_TOKEN }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "::error::RELEASE_TOKEN secret is required for the release workflow"
          echo "::error::The default GITHUB_TOKEN cannot create pull requests"
          echo "::error::Please follow the setup instructions in docs/RELEASE-PROCESS.md"
          echo "::error::See https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/docs/RELEASE-PROCESS.md"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: 'chore: Version packages'
          title: 'chore: Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # NPM_TOKEN is optional when using trusted publishing with OIDC
          # If NPM_TOKEN is not set, npm will use OIDC authentication via id-token permission
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Packages published with provenance:"
          echo "${{ steps.changesets.outputs.publishedPackages }}"
          echo ""
          echo "Publishing method: ${{ secrets.NPM_TOKEN && 'Token-based (traditional)' || 'OIDC Trusted Publishing' }}"
          echo "Provenance is automatically included with npm v9.5.0+ when using OIDC or --provenance flag"
