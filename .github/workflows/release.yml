name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Validate RELEASE_TOKEN
        if: ${{ !secrets.RELEASE_TOKEN }}
        run: |
          echo "::error::RELEASE_TOKEN secret is required for the release workflow"
          echo "::error::The default GITHUB_TOKEN cannot create pull requests"
          echo "::error::Please follow the setup instructions in docs/RELEASE-PROCESS.md"
          echo "::error::See https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/docs/RELEASE-PROCESS.md"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: 'chore: Version packages'
          title: 'chore: Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Packages published with provenance:"
          echo "${{ steps.changesets.outputs.publishedPackages }}"
