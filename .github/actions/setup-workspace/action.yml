name: 'Setup Workspace'
description: 'Setup Node.js, pnpm and install dependencies for the cli-ops workspace'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  frozen-lockfile:
    description: 'Use --frozen-lockfile flag for pnpm install'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}
      shell: bash
